name: PixelResize Image Regression Tests

on:
  push:
    branches:
      - seo-tool-logic-fix-2026-10-07
    paths:
      - 'script.js'
      - 'index.html'
      - 'style.css'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/workflows/image-regression.yml'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Choose which automated regression checks to run'
        required: true
        type: choice
        options:
          - all
          - target-size
          - crop-resize
          - gif-convert
          - transform
          - standard-convert
          - avif-convert
          - bmp-convert
          - privacy-errors
          - mobile-layout
          - route-navigation
        default: all

permissions:
  contents: read

concurrency:
  group: pixelresize-image-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    name: Image processing regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        run: npx playwright install chromium

      - name: Start local static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/pixelresize-server.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pixelresize-server.log
          exit 1

      - name: Run target-size compression regression
        if: github.event_name == 'push' || inputs.test_suite == 'all' || inputs.test_suite == 'target-size'
        run: npx playwright test tests/target-size.spec.cjs --reporter=line

      - name: Run crop and resize regression
        if: github.event_name == 'push' || inputs.test_suite == 'all' || inputs.test_suite == 'crop-resize'
        run: npx playwright test tests/crop-resize.spec.cjs --reporter=line

      - name: Run GIF conversion regression
        if: github.event_name == 'push' || inputs.test_suite == 'all' || inputs.test_suite == 'gif-convert'
        run: npx playwright test tests/gif-convert.spec.cjs --reporter=line

      - name: Run rotate and flip regression
        if: github.event_name == 'push' || inputs.test_suite == 'all' || inputs.test_suite == 'transform'
        run: npx playwright test tests/transform.spec.cjs --reporter=line

      - name: Run JPG, PNG and WebP conversion regressions
        if: github.event_name == 'push' || inputs.test_suite == 'all' || inputs.test_suite == 'standard-convert'
        run: npx playwright test tests/standard-convert.spec.cjs --reporter=line

      - name: Run AVIF conversion regression
        if: github.event_name == 'push' || inputs.test_suite == 'all' || inputs.test_suite == 'avif-convert'
        run: npx playwright test tests/avif-convert.spec.cjs --reporter=line

      - name: Run BMP conversion regression
        if: github.event_name == 'push' || inputs.test_suite == 'all' || inputs.test_suite == 'bmp-convert'
        run: npx playwright test tests/bmp-convert.spec.cjs --reporter=line

      - name: Run privacy and error-handling regression
        if: github.event_name == 'push' || inputs.test_suite == 'all' || inputs.test_suite == 'privacy-errors'
        run: npx playwright test tests/privacy-errors.spec.cjs --reporter=line

      - name: Run mobile layout regression
        if: github.event_name == 'push' || inputs.test_suite == 'all' || inputs.test_suite == 'mobile-layout'
        run: npx playwright test tests/mobile-layout.spec.cjs --reporter=line

      - name: Run tool route and preset regression
        if: github.event_name == 'push' || inputs.test_suite == 'all' || inputs.test_suite == 'route-navigation'
        run: npx playwright test tests/route-navigation.spec.cjs --reporter=line
